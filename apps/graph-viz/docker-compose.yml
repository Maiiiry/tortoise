# Tortoise — one-command startup
# docker compose up -d  (starts FalkorDB)
# then: python3 server/main.py & npx vite --host --port 5173

services:
  falkordb:
    # #8083 — PINNED, not `falkordb/falkordb:latest`. That tag tracks the v6
    # core, whose `reply.rs:655` panic EXITS the server (losing every graph in
    # this container) on a read-only aggregate query that RETURNs `count(*)`
    # beside a property absent from every matched row. Measured 2026-10-18:
    # `falkordb/falkordb:latest` (graph ver 60002) exits 1; this pin (42006)
    # returns the row with `null` and keeps serving. Same engine the repo's CI
    # provisions (`.github/actions/falkordb-provision` default) and the same
    # value as `tools/test_lane.py::PINNED_IMAGE`, held in lockstep by
    # `tests/test_8083_falkordb_engine_pin.py`. The `-server` image is
    # sufficient here: this app's own UI is the Vite server, not FalkorDB's
    # browser surface, so only the graph module is needed.
    image: falkordb/falkordb-server:v4.20.6
    container_name: tortoise-falkordb
    ports:
      # Loopback only (#7637): the server (`python3 server/main.py`) dials
      # localhost:16379 from this host. A bare "16379:6379" publishes
      # 0.0.0.0:16379 — an unauthenticated FalkorDB on the LAN.
      - "127.0.0.1:16379:6379"
    environment:
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000
    volumes:
      - tortoise-data:/var/lib/falkordb/data
    restart: always

volumes:
  tortoise-data:
